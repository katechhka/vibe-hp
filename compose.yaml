services:
  shop:
    build: .
    image: letters-and-stars:local
    restart: unless-stopped
    init: true
    env_file: .env.production
    environment:
      DATABASE_PATH: /data/shop.sqlite
      UPLOADS_PATH: /data/uploads
      BACKUP_PATH: /data/backups
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - shop_data:/data
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  proxy:
    image: caddy:2
    profiles: [public]
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      shop:
        condition: service_healthy
volumes:
  shop_data:
  caddy_data:
  caddy_config:
